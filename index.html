<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: planilla de arbitraje en una columna; pestañas fijas arriba y filas de mesa grandes para capturar con el pulgar. */
:root{
  --bg:#eef2ec; --surface:#fbfcfa; --ink:#14221a; --muted:#56655c; --line:#cfd8cf;
  --felt:#2c6a49; --on-felt:#f6faf6; --felt-soft:#dbe9df;
  --buff:#f0e2b6; --on-buff:#3d3210;
  --danger:#a3312a; --piece-w:#ffffff; --piece-b:#14221a;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1612; --surface:#17211b; --ink:#e6eee8; --muted:#97a89d; --line:#2a3a30;
    --felt:#5fb486; --on-felt:#07130c; --felt-soft:#1f3327;
    --buff:#4a4222; --on-buff:#f3e7bd;
    --danger:#ec8279; --piece-w:#eef2ec; --piece-b:#050a07; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#17211b; --ink:#e6eee8; --muted:#97a89d; --line:#2a3a30;
  --felt:#5fb486; --on-felt:#07130c; --felt-soft:#1f3327;
  --buff:#4a4222; --on-buff:#f3e7bd;
  --danger:#ec8279; --piece-w:#eef2ec; --piece-b:#050a07; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 56px;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.glyph{flex:none;width:30px;height:30px;border-radius:5px;border:1px solid var(--line);
  background:conic-gradient(var(--felt) 25%,var(--buff) 0 50%,var(--felt) 0 75%,var(--buff) 0)}
.brand div{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.15;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.status{margin:2px 0 0;color:var(--muted);font-size:.875rem}
.cloud{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.cloud.sync{color:var(--felt);border-color:var(--felt)}
/* encabezado: estado y salir */
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.exit{min-height:40px;padding:0 14px}
.exitbox{background:var(--buff);color:var(--on-buff);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.appline{margin:2px 0 0;color:var(--muted);font-size:.75rem;letter-spacing:.02em}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--bg);padding-block:6px;border-bottom:1px solid var(--line)}
.tabs button{min-height:44px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;padding:0 4px}
.tabs button[aria-selected="true"]{background:var(--felt);color:var(--on-felt)}

main{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.15;margin:0;text-wrap:balance}
h2 small{font-family:var(--body);font-weight:500;font-size:.95rem;color:var(--muted)}
h3{font-family:var(--body);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h3 small{letter-spacing:0;text-transform:none;font-weight:400;font-size:.875rem}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.note{color:var(--muted);font-size:.875rem;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--felt-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.banner.buff{background:var(--buff);color:var(--on-buff)}
.banner b.big{font-family:var(--display);font-size:1.35rem;line-height:1.2}

.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--on-felt);font-size:1.02rem;min-height:50px}
.btn.wide{width:100%}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--felt);outline-offset:2px}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{min-height:44px;border:0;background:var(--felt-soft);font-size:1.25rem;font-weight:600;cursor:pointer}
.stepper input{min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.text{min-height:44px;width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 12px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;min-width:52px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{font-size:.9rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.prog.done{color:var(--felt)}

.clockbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;background:var(--surface)}
.clock{font-family:var(--display);font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums;min-width:4.2ch;margin-right:auto}
.clock.zero{color:var(--danger)}
.clockbar .lbl{order:-1;flex:none}

.games{display:flex;flex-direction:column;gap:8px}
.game{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.mesa{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.mesa span{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mesa b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.sides{display:flex;flex-direction:column;gap:6px;min-width:0}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.pc{flex:none;width:14px;height:14px;border-radius:3px;border:1.5px solid var(--muted);background:var(--piece-w)}
.pc.b{background:var(--piece-b)}
.num{flex:none;min-width:2.3em;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:7px;padding:1px 4px;background:var(--bg)}
.nm{min-width:0;overflow-wrap:break-word;font-size:.95rem;line-height:1.2}
.nm.empty{color:var(--muted)}
.side.win .num{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
.side.draw .num{background:var(--buff);border-color:var(--buff);color:var(--on-buff)}
.side.lose{color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(3,46px);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.res button{min-height:46px;border:0;border-left:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.res button:first-child{border-left:0}
.res button[aria-pressed="true"]{background:var(--felt);color:var(--on-felt)}
.res button[data-r="d"][aria-pressed="true"]{background:var(--buff);color:var(--on-buff)}
.res button:disabled{cursor:default;opacity:1}
.res button:disabled:not([aria-pressed="true"]){color:var(--line)}
.bye{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted)}
.bye b{color:var(--ink)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.name{text-align:left;white-space:normal;min-width:12ch;overflow-wrap:break-word}
td.pts{font-family:var(--display);font-weight:700;font-size:1.05rem}
td.place{font-family:var(--display);font-weight:700}
tr.out td{color:var(--muted)}
tr.top1 td{background:var(--felt-soft)}

.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.prow .text{min-width:0}
.sw{display:flex;align-items:center;gap:6px;font-size:.875rem;min-height:44px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--felt)}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface)}
summary{font-weight:600;cursor:pointer}
details ol,details ul{margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:62ch}
details p{margin-top:12px;max-width:62ch}
label.btn{display:inline-flex;align-items:center}
.about{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.about .apptitle{display:flex;flex-direction:column;align-items:center;gap:2px}
.about .apptitle b{font-family:var(--display);font-size:1.3rem;line-height:1.15}
.about .apptitle span{color:var(--muted);font-size:.9rem}
.about h4{margin:0 0 4px;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.about p{max-width:52ch;margin-inline:auto}
.about .tech{display:flex;flex-direction:column;align-items:center;gap:4px}
.motto{font-style:italic}
.upd{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;max-width:728px;margin:0 auto}
.upd span{flex:1;min-width:12ch}
.upd button{min-height:40px;border-radius:9px;border:0;padding:0 14px;background:var(--felt);color:var(--on-felt);font-weight:600;cursor:pointer}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px;font-size:.875rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:calc(100% - 32px);z-index:9;text-align:center}
@media (max-width:560px){
  .game{grid-template-columns:46px minmax(0,1fr)}
  .res{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}
  .clockbar .lbl{display:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="glyph" aria-hidden="true"></span>
      <div><h1 id="t-name">Torneo de Ajedrez Escolar</h1><p class="status" id="t-status"></p><p class="appline">Torneo Suizo Escolar · 30 Santo Domingo · versión 1.2.1</p></div>
    </div>
    <div class="topright"><span class="cloud" id="cloud">En este dispositivo</span><button type="button" class="btn exit" id="b-exit" data-act="exit-ask">Salir</button></div>
  </header>
  <div class="exitbox" id="exitbox" role="alertdialog" aria-live="polite" hidden></div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" id="tab-ronda" data-act="tab" data-t="ronda">Ronda</button>
    <button role="tab" id="tab-pos" data-act="tab" data-t="pos">Posiciones</button>
    <button role="tab" id="tab-jug" data-act="tab" data-t="jug">Jugadores</button>
    <button role="tab" id="tab-aj" data-act="tab" data-t="aj">Ajustes</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";

/* ---------- Lógica del torneo (sin DOM) ---------- */
function blank(n){
  var ps=[]; for(var i=1;i<=n;i++) ps.push({id:i,name:"",active:true});
  return {v:1,name:"Torneo de Ajedrez Escolar",boards:7,rounds:4,minutes:15,players:ps,rondas:[],playoff:null,updatedAt:0,device:""};
}
// Puntos se guardan al doble (victoria 2, tablas 1) para no usar decimales.
function stats(st,upto){
  var S={};
  st.players.forEach(function(p){S[p.id]={id:p.id,pts:0,opp:[],col:[],w:0,b:0,bye:0,wait:0,win:0,res:[]};});
  var R=st.rondas.slice(0,upto==null?st.rondas.length:upto);
  R.forEach(function(rd,ri){
    rd.games.forEach(function(g){
      if(g.b==null){var s=S[g.w]; if(s){s.pts+=2;s.bye++;s.res[ri]="D";} return;}
      var a=S[g.w],c=S[g.b]; if(!a||!c) return;
      a.opp.push(c.id); c.opp.push(a.id); a.col.push("w"); c.col.push("b"); a.w++; c.b++;
      if(g.tanda>0){a.wait++;c.wait++;}
      if(g.res==="1-0"){a.pts+=2;a.win++;a.res[ri]="1";c.res[ri]="0";}
      else if(g.res==="0-1"){c.pts+=2;c.win++;a.res[ri]="0";c.res[ri]="1";}
      else if(g.res==="d"){a.pts++;c.pts++;a.res[ri]="½";c.res[ri]="½";}
      else{a.res[ri]="·";c.res[ri]="·";}
    });
  });
  return S;
}
function pref(s){
  var want=null,str=0,bal=s.w-s.b,n=s.col.length,last=s.col[n-1];
  if(bal>0){want="b";str=Math.abs(bal)>=2?3:2;}else if(bal<0){want="w";str=Math.abs(bal)>=2?3:2;}else if(last){want=last==="w"?"b":"w";str=1;}
  if(n>=2&&s.col[n-1]===s.col[n-2]){want=last==="w"?"b":"w";str=3;}
  return {want:want,str:str};
}
function clash(a,b){
  var x=pref(a),y=pref(b);
  if(!x.want||x.want!==y.want) return 0;
  if(x.str===3&&y.str===3) return 300;
  if(x.str>=2&&y.str>=2) return x.str+y.str>=5?60:40;
  return 5;
}
function seat(games,boards,S,isLast){
  var ord=games.map(function(g){return {g:g,top:Math.max(S[g.w].wait,S[g.b].wait),wait:S[g.w].wait+S[g.b].wait};});
  ord.sort(function(x,y){
    if(isLast){if(x.g.rk===0)return -1; if(y.g.rk===0)return 1;}
    return y.top-x.top||y.wait-x.wait||x.g.rk-y.g.rk;
  });
  ord.forEach(function(o,k){o.g.tanda=Math.floor(k/boards);});
  var nT=Math.ceil(games.length/boards);
  for(var t=0;t<nT;t++){
    games.filter(function(g){return g.tanda===t;}).sort(function(a,b){return a.rk-b.rk;}).forEach(function(g,m){g.mesa=m+1;});
  }
}
function pairRound(st){
  var S=stats(st), isLast=st.rondas.length>=st.rounds-1;
  var list=st.players.filter(function(p){return p.active;}).map(function(p){return p.id;})
    .sort(function(x,y){return S[y].pts-S[x].pts||x-y;});
  var bye=null;
  if(list.length%2===1){
    for(var i=list.length-1;i>=0;i--){if(!S[list[i]].bye){bye=list[i];break;}}
    if(bye==null) bye=list[list.length-1];
    list=list.filter(function(x){return x!==bye;});
  }
  var played=function(a,b){return S[a].opp.indexOf(b)>=0;};
  var nodes=0;
  function rec(rem,allowRepeat){
    if(!rem.length) return [];
    if(++nodes>150000) return null;
    var p=rem[0],rest=rem.slice(1);
    var grp=rest.filter(function(x){return S[x].pts===S[p].pts;});
    var ideal=Math.floor((grp.length+1)/2)-1, cands=[];
    rest.forEach(function(c,i){
      var rep=played(p,c); if(rep&&!allowRepeat) return;
      var gi=grp.indexOf(c);
      var cost=(S[p].pts-S[c].pts)*1000+(gi>=0?Math.abs(gi-ideal)*10:i*10);
      cost+=clash(S[p],S[c]);
      if(rep) cost+=100000;
      cands.push({c:c,cost:cost});
    });
    cands.sort(function(a,b){return a.cost-b.cost;});
    for(var k=0;k<cands.length;k++){
      var c=cands[k].c;
      var r=rec(rest.filter(function(x){return x!==c;}),allowRepeat);
      if(r) return [[p,c]].concat(r);
    }
    return null;
  }
  var pairs=rec(list,false);
  if(!pairs){nodes=0;pairs=rec(list,true);}
  if(!pairs){pairs=[];for(var j=0;j+1<list.length;j+=2)pairs.push([list[j],list[j+1]]);}
  // Mejora por intercambio: cambia rivales entre dos mesas si eso evita repetir color sin romper los grupos de puntos.
  var rankOf={}; list.forEach(function(id,i){rankOf[id]=i;});
  var pc=function(a,b){return Math.abs(S[a].pts-S[b].pts)*1000+clash(S[a],S[b])+(played(a,b)?100000:0);};
  var ord2=function(a,b){return rankOf[a]<rankOf[b]?[a,b]:[b,a];};
  for(var it=0,moved=true;moved&&it<60;it++){
    moved=false;
    for(var i1=0;i1<pairs.length;i1++){for(var i2=i1+1;i2<pairs.length;i2++){
      var A=pairs[i1],B=pairs[i2],cur=pc(A[0],A[1])+pc(B[0],B[1]);
      var o1=pc(A[0],B[0])+pc(A[1],B[1]),o2=pc(A[0],B[1])+pc(A[1],B[0]);
      if(o1<cur&&o1<=o2){pairs[i1]=ord2(A[0],B[0]);pairs[i2]=ord2(A[1],B[1]);moved=true;}
      else if(o2<cur){pairs[i1]=ord2(A[0],B[1]);pairs[i2]=ord2(A[1],B[0]);moved=true;}
    }}
  }
  pairs.sort(function(x,y){return rankOf[x[0]]-rankOf[y[0]];});
  var games=pairs.map(function(pr,i){
    var a=pr[0],b=pr[1],x=pref(S[a]),y=pref(S[b]),aWhite;
    if(x.want&&y.want&&x.want!==y.want) aWhite=x.want==="w";
    else if(x.want&&!y.want) aWhite=x.want==="w";
    else if(!x.want&&y.want) aWhite=y.want!=="w";
    else if(x.want&&y.want){var ax=Math.abs(S[a].w-S[a].b),ay=Math.abs(S[b].w-S[b].b);aWhite=(x.str>y.str||(x.str===y.str&&ax>=ay))?x.want==="w":y.want!=="w";}
    else aWhite=i%2===0;
    return {w:aWhite?a:b,b:aWhite?b:a,res:null,rk:i,tanda:0,mesa:i+1};
  });
  seat(games,Math.max(1,st.boards),S,isLast);
  if(bye!=null) games.push({w:bye,b:null,res:"bye",rk:999,tanda:-1,mesa:0});
  return games;
}
function direct(st,a,b){
  var w=null;
  st.rondas.forEach(function(rd){rd.games.forEach(function(g){
    if(g.b==null) return;
    if((g.w===a&&g.b===b)||(g.w===b&&g.b===a)){
      if(g.res==="1-0") w=g.w; else if(g.res==="0-1") w=g.b;
    }
  });});
  return w;
}
function roundDone(rd){return rd.games.every(function(g){return g.res!=null;});}
function finished(st){return st.rondas.length>0&&st.rondas.length>=st.rounds&&st.rondas.every(roundDone);}
function standings(st){
  var S=stats(st);
  var rows=st.players.map(function(p){
    var s=S[p.id];
    var op=s.opp.map(function(o){return S[o].pts;});
    for(var k=0;k<s.bye;k++) op.push(0);
    var buch=op.reduce(function(t,x){return t+x;},0);
    var cut1=op.length>1?buch-Math.min.apply(null,op):0;
    return {id:p.id,name:p.name,active:p.active,pts:s.pts,buch:buch,cut1:cut1,win:s.win,res:s.res,played:s.opp.length+s.bye,dir:false,po:false,tie:false};
  });
  rows.sort(function(a,b){return b.pts-a.pts||b.buch-a.buch||b.cut1-a.cut1||b.win-a.win||a.id-b.id;});
  for(var i=0;i<rows.length-1;i++){
    var a=rows[i],b=rows[i+1];
    var two=a.pts===b.pts&&(i===0||rows[i-1].pts!==a.pts)&&(i+2>=rows.length||rows[i+2].pts!==a.pts);
    if(!two) continue;
    var w=direct(st,a.id,b.id);
    if(w!=null){a.dir=true;b.dir=true;if(w===b.id){rows[i]=b;rows[i+1]=a;}}
  }
  var po=st.playoff;
  if(po&&po.winner!=null&&rows.length>1){
    var ids=[rows[0].id,rows[1].id];
    if(ids.indexOf(po.a)>=0&&ids.indexOf(po.b)>=0&&rows[0].pts===rows[1].pts){
      rows[0].po=true;rows[1].po=true;
      if(rows[1].id===po.winner){var t=rows[0];rows[0]=rows[1];rows[1]=t;}
    }
  }
  var same=function(x,y){return x.pts===y.pts&&x.buch===y.buch&&x.cut1===y.cut1&&x.win===y.win&&!(x.dir&&y.dir)&&!(x.po&&y.po);};
  rows.forEach(function(r,i){
    r.place=i+1;
    r.tie=r.played>0&&((i>0&&same(rows[i-1],r))||(i<rows.length-1&&same(r,rows[i+1])));
  });
  return rows;
}
function needFinal(st,rows){
  if(!finished(st)||rows.length<2) return null;
  var a=rows[0],b=rows[1];
  if(a.pts!==b.pts||a.dir||a.po) return null;
  var perfect=a.pts===2*st.rondas.length;
  var eq=function(x,y){return x.buch===y.buch&&x.cut1===y.cut1&&x.win===y.win;};
  if(!perfect&&!eq(a,b)) return null;
  if(rows.length>2&&rows[2].pts===a.pts&&(perfect||eq(rows[2],a))) return null;
  return {a:a.id,b:b.id};
}
if(typeof document==="undefined"){
  module.exports={blank:blank,stats:stats,pairRound:pairRound,standings:standings,needFinal:needFinal,finished:finished,roundDone:roundDone,direct:direct};
  return;
}

var LS_KEY="torneo-suizo-v1";
var DEVICE=Math.random().toString(36).slice(2,10);
var LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function loadLocal(){try{var s=localStorage.getItem(LS_KEY);var d=s?JSON.parse(s):null;return d&&Array.isArray(d.players)&&Array.isArray(d.rondas)?d:null;}catch(e){return null;}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}

var readOnly=false,docRef=null,writing=false,dirty=false,saveTimer=null,firstSnap=true,pendingRender=false;

function setCloud(mode){
  var el=document.getElementById("cloud"); if(!el) return;
  el.className="cloud"+(mode==="sync"?" sync":"");
  el.textContent=mode==="sync"?"Guardado en la nube":mode==="ro"?"Solo lectura":"En este dispositivo";
}
function queueCloud(){
  if(!docRef||readOnly) return;
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,500);
}
function flush(){
  if(writing||!dirty||!docRef) return;
  writing=true; dirty=false;
  docRef.set(JSON.parse(JSON.stringify(state))).then(function(){setCloud("sync");},function(e){
    if(e&&e.code==="invalid_argument"){readOnly=true;setCloud("ro");render();}
    else setCloud("local");
  }).then(function(){writing=false; if(dirty) flush();});
}
function initCloud(){
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db) return;
    var ready=user?user.can("data.write"):Promise.resolve(null);
    ready.then(function(cw){
      if(cw===false){readOnly=true;render();}
      docRef=db.doc("torneos/actual");
      docRef.onSnapshot(function(snap){
        var first=firstSnap; firstSnap=false;
        if(!snap.exists){
          if(first&&!readOnly&&state.updatedAt>0) queueCloud();
          setCloud(readOnly?"ro":"sync"); return;
        }
        if(snap.metadata&&snap.metadata.hasPendingWrites) return;
        var d=snap.data();
        if(!d||!Array.isArray(d.players)||!Array.isArray(d.rondas)) return;
        if(readOnly||(d.updatedAt||0)>(state.updatedAt||0)){
          state=JSON.parse(JSON.stringify(d)); saveLocal(); deferRender();
        }else if(first&&!readOnly&&(d.updatedAt||0)<(state.updatedAt||0)){
          queueCloud();
        }
        setCloud(readOnly?"ro":"sync");
      },function(){setCloud("local");});
    });
  },function(){});
}
function mutate(fn,quiet){
  if(readOnly) return;
  fn(state);
  state.updatedAt=Date.now(); state.device=DEVICE;
  saveLocal(); queueCloud();
  if(!quiet) render();
}
function deferRender(){
  var a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.type!=="checkbox"){pendingRender=true;return;}
  render();
}

/* ---------- Utilidades de vista ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pname(id){for(var i=0;i<state.players.length;i++){if(state.players[i].id===id)return state.players[i].name||"";}return "";}
function activeCount(){return state.players.filter(function(p){return p.active;}).length;}
function tandasPerRound(){return Math.max(1,Math.ceil(Math.floor(activeCount()/2)/Math.max(1,state.boards)));}
function fmtDur(min){var h=Math.floor(min/60),m=min%60;return (h?h+" h ":"")+(m||!h?m+" min":"").trim();}
function estimate(){return 10+state.rounds*tandasPerRound()*(state.minutes+5);}
function fmtPts(p2){var w=Math.floor(p2/2);return p2%2?(w?w+"½":"½"):String(w);}

/* ---------- Reloj de tanda ---------- */
var T={left:0,end:0,run:false,ac:null};
function tReset(){T.run=false;T.left=state.minutes*60000;}
function tLeft(){return T.run?Math.max(0,T.end-Date.now()):T.left;}
function fmtClock(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function beep(){
  try{
    if(!T.ac) return;
    [0,0.35,0.7].forEach(function(dt){
      var o=T.ac.createOscillator(),g=T.ac.createGain();
      o.frequency.value=880; o.connect(g); g.connect(T.ac.destination);
      g.gain.setValueAtTime(0.25,T.ac.currentTime+dt);
      g.gain.exponentialRampToValueAtTime(0.001,T.ac.currentTime+dt+0.28);
      o.start(T.ac.currentTime+dt); o.stop(T.ac.currentTime+dt+0.3);
    });
  }catch(e){}
}
tReset();
setInterval(function(){
  var el=document.getElementById("clock"); if(!el) return;
  var l=tLeft(); el.textContent=fmtClock(l);
  if(T.run&&l<=0){T.run=false;T.left=0;beep();toast("Se acabó el tiempo de la tanda");render();}
},250);

/* ---------- Pantalla encendida durante la ronda ---------- */
var WL=null,wlBusy=false;
function syncWake(){
  try{
    var want=state.rondas.length>0&&!finished(state)&&document.visibilityState==="visible";
    if(want&&!WL&&!wlBusy&&navigator.wakeLock&&navigator.wakeLock.request){
      wlBusy=true;
      navigator.wakeLock.request("screen").then(function(l){wlBusy=false;WL=l;l.addEventListener("release",function(){WL=null;});},function(){wlBusy=false;});
    }else if(!want&&WL){WL.release();WL=null;}
  }catch(e){wlBusy=false;}
}

/* ---------- Archivos: respaldo y CSV ---------- */
function stamp(){var d=new Date(),z=function(n){return (n<10?"0":"")+n;};return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes());}
function showText(txt,msg){ui.copy=txt;ui.copyMsg=msg;render();var ta=document.getElementById("copybox");if(ta){ta.focus();ta.select();}}
function saveFile(name,text,mime){
  var manual=function(){showText(text,"No se pudo guardar el archivo aquí. Copia este texto y guárdalo en un archivo llamado "+name+".");};
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(dl){
      if(!dl) return manual();
      dl.save({filename:name,data:text}).then(function(){toast("Archivo listo: "+name);},function(e){
        var c=e&&e.code;
        if(c==="declined") return;
        if(c==="rate_limited") return toast("Ya hay una descarga pendiente. Intenta de nuevo en un momento.");
        manual();
      });
    },manual);
    return;
  }
  try{
    var blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    toast("Archivo guardado: "+name);
  }catch(e){manual();}
}
function backupText(){return JSON.stringify({app:"Torneo Suizo Escolar",version:VERSION,guardado:new Date().toISOString(),torneo:state},null,1);}
function parseBackup(txt){
  var d=JSON.parse(txt); if(d&&d.torneo) d=d.torneo;
  if(!d||!Array.isArray(d.players)||!Array.isArray(d.rondas)) throw new Error("formato");
  d.players.forEach(function(p){if(typeof p.id!=="number")throw new Error("formato");});
  d.rondas.forEach(function(r){if(!r||!Array.isArray(r.games))throw new Error("formato");});
  var base=blank(d.players.length);
  Object.keys(base).forEach(function(k){if(d[k]==null)d[k]=base[k];});
  return d;
}
function csvText(){
  var rows=standings(state),n=state.rondas.length;
  var q=function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var num=function(p2){return String(p2/2);};
  var head=["Lugar","No.","Alumno"];
  for(var i=0;i<n;i++) head.push("R"+(i+1));
  head=head.concat(["Puntos","Buchholz","Buchholz-1","Ganadas","Estado"]);
  var out=[head.map(q).join(",")];
  var cell={"1":"1","½":"0.5","0":"0","D":"1 (descanso)","·":""};
  rows.forEach(function(r){
    var line=[r.place+(r.tie?"=":""),r.id,r.name||""];
    for(var k=0;k<n;k++) line.push(r.res[k]!=null?cell[r.res[k]]:"");
    line=line.concat([num(r.pts),num(r.buch),num(r.cut1),r.win,r.active?"Juega":"Retirado"]);
    out.push(line.map(q).join(","));
  });
  return "\uFEFF"+out.join("\r\n");
}

/* ---------- Sorteo de números ---------- */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var r;
    try{var u=new Uint32Array(1);crypto.getRandomValues(u);r=u[0]%(i+1);}catch(e){r=Math.floor(Math.random()*(i+1));}
    var t=a[i];a[i]=a[r];a[r]=t;
  }
  return a;
}
function sorteoNames(){
  return ui.sorteoText.split(/\r?\n/).map(function(l){return l.split("\t").map(function(c){return c.trim();}).filter(Boolean).join(" ").replace(/\s+/g," ").trim();}).filter(Boolean).slice(0,200);
}

/* ---------- Acciones ---------- */
function setNum(k,v){
  var lim={players:[2,200],boards:[1,100],rounds:[Math.max(1,state.rondas.length),15],minutes:[3,120]}[k];
  if(!lim||isNaN(v)) return render();
  v=Math.max(lim[0],Math.min(lim[1],Math.round(v)));
  if(k==="players"&&state.rondas.length>0) return render();
  mutate(function(s){
    if(k==="players"){
      while(s.players.length<v) s.players.push({id:s.players.length+1,name:"",active:true});
      s.players.length=v;
    }else s[k]=v;
    if(k==="boards"&&s.rondas.length){
      var li=s.rondas.length-1,real=s.rondas[li].games.filter(function(g){return g.b!=null;});
      if(real.every(function(g){return g.res==null;})) seat(real,s.boards,stats(s,li),li>=s.rounds-1);
    }
  });
  if(k==="minutes"&&!T.run){tReset();render();}
}
function roundText(ri){
  var rd=state.rondas[ri],out=[(state.name||"Torneo")+" · Ronda "+(ri+1),"(el primero lleva blancas)"],nT=0;
  rd.games.forEach(function(g){if(g.tanda+1>nT)nT=g.tanda+1;});
  var who=function(id){var nm=pname(id);return id+(nm?" "+nm:"");};
  for(var t=0;t<nT;t++){
    if(nT>1) out.push("","Tanda "+LETTERS[t]);
    rd.games.filter(function(g){return g.tanda===t;}).sort(function(a,b){return a.mesa-b.mesa;}).forEach(function(g){
      var r=g.res==="1-0"?"  1–0":g.res==="0-1"?"  0–1":g.res==="d"?"  ½–½":"";
      out.push("Mesa "+g.mesa+": "+who(g.w)+" vs "+who(g.b)+r);
    });
  }
  rd.games.forEach(function(g){if(g.b==null)out.push("","Descansa: "+who(g.w));});
  return out.join("\n");
}
function playersText(){
  var out=[(state.name||"Torneo")+" · Jugadores ("+activeCount()+" juegan)",""];
  state.players.forEach(function(p){out.push("No. "+p.id+" · "+(p.name||"(sin nombre)")+(p.active?"":" (no juega)"));});
  return out.join("\n");
}
function standingsText(){
  var rows=standings(state),out=[(state.name||"Torneo")+" · Posiciones"+(finished(state)?" finales":" tras "+state.rondas.length+" rondas"),""];
  rows.forEach(function(r){out.push(r.place+(r.tie?"=":"")+". No. "+r.id+(r.name?" "+r.name:"")+" · "+fmtPts(r.pts)+" pts · Bch "+fmtPts(r.buch)+" · Bch-1 "+fmtPts(r.cut1)+" · Gan "+r.win);});
  return out.join("\n");
}
function copyText(txt){
  var fail=function(){showText(txt,"");};
  try{navigator.clipboard.writeText(txt).then(function(){toast("Copiado. Pégalo donde lo necesites.");},fail);}catch(e){fail();}
}
function act(a,d){
  switch(a){
    case "tab": ui.tab=d.t; ui.confirm=null; ui.copy=null; ui.unlock=false; ui.restore=null; render(); window.scrollTo(0,0); break;
    case "round": ui.round=+d.i; ui.unlock=false; ui.confirm=null; render(); break;
    case "step": setNum(d.k,(d.k==="players"?state.players.length:state[d.k])+(+d.d)); break;
    case "start":
      if(activeCount()<2) return;
      mutate(function(s){s.rondas=[{games:pairRound(s)}];s.playoff=null;}); ui.round=null; tReset(); render(); window.scrollTo(0,0); break;
    case "res":
      var ri=+d.ri,gi=+d.gi;
      if(ri!==state.rondas.length-1&&!ui.unlock) return;
      mutate(function(s){var g=s.rondas[ri]&&s.rondas[ri].games[gi]; if(!g||g.b==null) return; g.res=g.res===d.r?null:d.r; s.playoff=null;});
      break;
    case "next":
      var cur=state.rondas[state.rondas.length-1];
      if(!cur||!roundDone(cur)||state.rondas.length>=state.rounds) return;
      mutate(function(s){s.rondas.push({games:pairRound(s)});}); ui.round=null; ui.unlock=false; tReset(); render(); window.scrollTo(0,0);
      toast("Ronda "+state.rondas.length+" emparejada"); break;
    case "exit-ask": exitBox("ask"); break;
    case "exit-no": exitBox(null); break;
    case "exit-go": exitApp(); break;
    case "manual": ui.tab="aj"; ui.manual=true; ui.confirm=null; ui.copy=null; render(); var mm=document.getElementById("manual"); if(mm&&mm.scrollIntoView) mm.scrollIntoView(); break;
    case "unlock": ui.unlock=true; render(); break;
    case "ask": ui.confirm=d.c; render(); break;
    case "cancel": ui.confirm=null; ui.restore=null; render(); break;
    case "backup": saveFile("torneo-respaldo_"+stamp()+".json",backupText(),"application/json"); break;
    case "csv": saveFile("torneo-posiciones_"+stamp()+".csv",csvText(),"text/csv"); break;
    case "restore":
      if(!ui.restore) return;
      var data=ui.restore; ui.restore=null; ui.confirm=null; ui.round=null;
      mutate(function(s){Object.keys(s).forEach(function(k){delete s[k];}); Object.keys(data).forEach(function(k){s[k]=data[k];});});
      tReset(); render(); toast("Respaldo restaurado"); break;
    case "sortear":
      if(state.rondas.length) return;
      var names=sorteoNames();
      if(names.length<2){ui.confirm=null;render();toast("Pega al menos dos nombres, uno por renglón.");return;}
      shuffle(names);
      mutate(function(s){s.players=names.map(function(nm,i){return {id:i+1,name:nm,active:true};});});
      ui.confirm=null; ui.sorteoText=""; ui.sorteo=false; render();
      toast("Números sorteados para "+names.length+" alumnos. Revisa la lista."); break;
    case "undo": ui.confirm=null; ui.round=null; mutate(function(s){s.rondas.pop();s.playoff=null;}); break;
    case "reset": ui.confirm=null; ui.round=null; mutate(function(s){s.rondas=[];s.playoff=null;}); ui.tab="ronda"; tReset(); render(); break;
    case "addp": mutate(function(s){s.players.push({id:s.players.length+1,name:"",active:true});}); break;
    case "po": mutate(function(s){s.playoff={a:+d.a,b:+d.b,winner:+d.w};}); break;
    case "po-clear": mutate(function(s){s.playoff=null;}); break;
    case "copy-r":
      if(!state.rondas.length) return;
      var last=state.rondas.length-1; copyText(roundText(ui.round==null?last:Math.min(ui.round,last))); break;
    case "copy-s": copyText(standingsText()); break;
    case "copy-p": copyText(playersText()); break;
    case "close-copy": ui.copy=null; render(); break;
    case "t-start":
      try{var AC=window.AudioContext||window.webkitAudioContext; if(AC&&!T.ac) T.ac=new AC(); if(T.ac&&T.ac.state==="suspended") T.ac.resume();}catch(e){}
      if(T.left<=0) T.left=state.minutes*60000;
      T.end=Date.now()+T.left; T.run=true; render(); break;
    case "t-pause": T.left=tLeft(); T.run=false; render(); break;
    case "t-reset": tReset(); render(); break;
  }
}

  if(t.classList&&t.classList.contains("pact")){
    var id=+t.dataset.id;
    mutate(function(s){s.players.forEach(function(p){if(p.id===id)p.active=t.checked;});});
  }else if(t.dataset&&t.dataset.k&&t.type==="number"){
    setNum(t.dataset.k,parseInt(t.value,10));
  }else if(t.id==="in-restore"&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{ui.restore=parseBackup(String(fr.result));ui.confirm="restore";render();}
      catch(e){ui.restore=null;ui.confirm=null;render();toast("Ese archivo no es un respaldo válido del torneo.");}
    };
    fr.onerror=function(){toast("No se pudo leer el archivo.");};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("toggle",function(e){if(!e.target)return; if(e.target.id==="manual") ui.manual=e.target.open; else if(e.target.id==="sorteo") ui.sorteo=e.target.open;},true);
document.addEventListener("focusout",function(){
  if(pendingRender) setTimeout(function(){if(pendingRender) deferRender();},0);
});

render();
initCloud();
})();
</script>
<div class="upd" id="upd" role="status" hidden><span>Hay una versión nueva de la app.</span><button type="button" id="b-upd">Actualizar</button></div>
<script>
(function(){
  if(!("serviceWorker" in navigator)||location.protocol.indexOf("http")!==0) return;
  var bar=document.getElementById("upd"),btn=document.getElementById("b-upd"),waiting=null,reloading=false;
  function offer(w){waiting=w;bar.hidden=false;}
  btn.addEventListener("click",function(){if(waiting){waiting.postMessage("activar");btn.disabled=true;}});
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloading)return;reloading=true;location.reload();});
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      if(reg.waiting&&navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener("updatefound",function(){
        var w=reg.installing; if(!w) return;
        w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller) offer(w);});
      });
      setInterval(function(){reg.update().catch(function(){});},60*60*1000);
    }).catch(function(){});
  });
})();
</script>
